name: Build RISC-V riscv-gnu-toolchain

runs:
  using: composite
  steps:
    - id: cache-riscv-gnu-toolchain
      uses: actions/cache@v5
      with:
        path: .riscv-gnu-toolchain
        key: riscv-gnu-toolchain-act4-${{ runner.os }}

    - shell: bash
      if: steps.cache-riscv-gnu-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p .riscv-gnu-toolchain
        cd .riscv-gnu-toolchain
        wget -q -O - https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2026.06.06/riscv32-elf-ubuntu-24.04-gcc.tar.xz | tar -xJ --transform "s/riscv/riscv32/"
        cd ..

    - shell: bash
      run: |
        echo "$(pwd)/.riscv-gnu-toolchain/riscv32/bin" >> $GITHUB_PATH


